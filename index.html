<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Астана: карта</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --void:#030818; --blue:#2f7bff; --ice:#cfe4ff; --red:#ff3b4f; --yellow:#ffd400; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--ice);
    font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; left: 0; right: 0; z-index: 5; display: flex; gap: 8px; padding: 0 12px;
    overflow-x: auto; white-space: nowrap; pointer-events: none; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .top { top: calc(10px + env(safe-area-inset-top, 0px)); }
  .bottom { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .btn { pointer-events: auto; flex: 0 0 auto; background: rgba(3,8,24,.88); color: var(--ice); font: inherit;
    font-weight: 700; font-size: 15px; letter-spacing: .04em; border: 1px solid var(--blue); padding: 8px 14px; cursor: pointer;
    box-shadow: 0 0 10px rgba(47,123,255,.5), inset 0 0 8px rgba(47,123,255,.25);
    clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px)); }
  .btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--c);
    box-shadow: 0 0 8px 2px var(--c); }
  .chip.off { opacity: .4; }
  .district { pointer-events: none; font-weight: 700; font-size: 22px; letter-spacing: .22em; text-transform: uppercase;
    color: #fff; text-shadow: 0 0 6px #2f7bff, 0 0 18px #2f7bff, 0 0 2px #000; white-space: nowrap; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { margin-bottom: 54px; }
  .maplibregl-ctrl-attrib { background: rgba(3,8,24,.7) !important; color: #8fa0d8 !important; }
  .maplibregl-ctrl-attrib a { color: #8fa0d8 !important; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar top" id="districts"></div>
<div class="bar bottom" id="chips"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // Названия районов и их примерное положение [долгота, широта]. Меняйте как нужно.
  var DISTRICTS = [
    { name:'Есиль',    ll:[71.430, 51.100] },
    { name:'Алматы',   ll:[71.470, 51.160] },
    { name:'Сарыарка', ll:[71.395, 51.175] },
    { name:'Байконур', ll:[71.465, 51.205] }
  ];
  // Группы мест: класс из данных OpenStreetMap и цвет точки
  var GROUPS = [
    { id:'cafe',  name:'Кафе',      color:'#ffd400', cls:['cafe'] },
    { id:'food',  name:'Еда',       color:'#ff8a1f', cls:['restaurant','fast_food','ice_cream','bakery'] },
    { id:'bar',   name:'Бары',      color:'#ff2ad4', cls:['bar','pub','nightclub'] },
    { id:'shop',  name:'Магазины',  color:'#19f0ff', cls:['shop','grocery','clothing_store','jewelry','convenience','supermarket','mall'] },
    { id:'other', name:'Сервисы',   color:'#7dff6a', cls:['hospital','pharmacy','bank','school','college','fuel','lodging','post','library','cinema','theatre','atm','gym'] }
  ];
  var flat = false;

  var map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [71.44, 51.13], zoom: 12.4, pitch: 45, bearing: -15, maxPitch: 75
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-left');
  map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true, positionOptions: { enableHighAccuracy: true } }), 'bottom-right');

  DISTRICTS.forEach(function (d) {
    var el = document.createElement('div'); el.className = 'district'; el.textContent = d.name;
    new maplibregl.Marker({ element: el }).setLngLat(d.ll).addTo(map);
    var b = document.createElement('button'); b.className = 'btn'; b.textContent = d.name;
    b.addEventListener('click', function () { map.flyTo({ center: d.ll, zoom: 14.6, duration: 2000 }); });
    document.getElementById('districts').appendChild(b);
  });
  var tilt = document.createElement('button'); tilt.className = 'btn'; tilt.textContent = 'Плоская карта';
  tilt.addEventListener('click', function () {
    flat = !flat;
    map.easeTo({ pitch: flat ? 0 : 45, bearing: flat ? 0 : -15, duration: 900 });
    tilt.textContent = flat ? 'Наклон 3D' : 'Плоская карта';
  });
  document.getElementById('districts').appendChild(tilt);

  GROUPS.forEach(function (g) {
    var b = document.createElement('button'); b.className = 'btn chip'; b.style.setProperty('--c', g.color);
    b.innerHTML = '<i></i>' + g.name;
    b.addEventListener('click', function () {
      var off = b.classList.toggle('off');
      ['poi-' + g.id, 'poi-' + g.id + '-label'].forEach(function (id) {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', off ? 'none' : 'visible');
      });
    });
    document.getElementById('chips').appendChild(b);
  });

  function firstSymbol() {
    var ls = map.getStyle().layers;
    for (var i = 0; i < ls.length; i++) if (ls[i].type === 'symbol') return ls[i].id;
    return undefined;
  }

  function build() {
    var before = firstSymbol();
    try {
      map.addLayer({ id:'road-glow', type:'line', source:'openmaptiles', 'source-layer':'transportation',
        filter:['match',['get','class'],['motorway','trunk','primary','secondary','tertiary'],true,false],
        layout:{ 'line-cap':'round', 'line-join':'round' },
        paint:{ 'line-color':'#1e5bff', 'line-opacity':0.6, 'line-blur':6,
          'line-width':['interpolate',['exponential',1.5],['zoom'],10,2,16,12,19,32] } }, before);
    } catch (e) {}
    try {
      map.addLayer({ id:'house-bodies', type:'fill-extrusion', source:'openmaptiles', 'source-layer':'building', minzoom:13,
        paint:{ 'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],6],0,'#7a0c24',30,'#c4162f',120,'#ff3b4f'],
          'fill-extrusion-height':['coalesce',['get','render_height'],6],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
          'fill-extrusion-opacity':0.95 } }, before);
      map.addLayer({ id:'house-outline', type:'line', source:'openmaptiles', 'source-layer':'building', minzoom:14,
        paint:{ 'line-color':'#ff6a78', 'line-width':0.7, 'line-opacity':0.75 } }, before);
    } catch (e) {}
    GROUPS.forEach(function (g) {
      try {
        map.addLayer({ id:'poi-' + g.id, type:'circle', source:'openmaptiles', 'source-layer':'poi', minzoom:13.5,
          filter:['match',['get','class'],g.cls,true,false],
          paint:{ 'circle-color':g.color, 'circle-radius':['interpolate',['linear'],['zoom'],13.5,2.5,16,5,19,9],
            'circle-stroke-width':['interpolate',['linear'],['zoom'],13.5,2,19,6], 'circle-stroke-color':g.color,
            'circle-stroke-opacity':0.35 } });
      } catch (e) {}
    });
    try {
      map.addLayer({ id:'poi-cafe-label', type:'symbol', source:'openmaptiles', 'source-layer':'poi', minzoom:16,
        filter:['==',['get','class'],'cafe'],
        layout:{ 'text-field':['get','name'], 'text-font':['Noto Sans Regular'], 'text-size':11, 'text-offset':[0,1.1], 'text-anchor':'top' },
        paint:{ 'text-color':'#ffd400', 'text-halo-color':'#030818', 'text-halo-width':1.5 } });
    } catch (e) {}
  }

  function paint() {
    map.getStyle().layers.forEach(function (l) {
      var id = l.id;
      if (/^(road-glow|house-|poi-)/.test(id)) return;
      try {
        if (l.type === 'background') map.setPaintProperty(id, 'background-color', '#030818');
        else if (l.type === 'fill') {
          var c = /water/.test(id) ? '#0a1f78' : /building/.test(id) ? '#5a0a1e' : /park|green|wood|forest|grass|national/.test(id) ? '#06143f' : '#050d2c';
          try { map.setPaintProperty(id, 'fill-pattern', undefined); } catch (e) {}
          map.setPaintProperty(id, 'fill-color', c);
          map.setPaintProperty(id, 'fill-opacity', 1);
        }
        else if (l.type === 'fill-extrusion' || l.type === 'raster' || l.type === 'hillshade') map.setLayoutProperty(id, 'visibility', 'none');
        else if (l.type === 'line') {
          var casing = /casing|outline|case/.test(id);
          var major = /motorway|trunk|primary|secondary|major/.test(id);
          var water = /water|river|stream/.test(id);
          map.setPaintProperty(id, 'line-color', casing ? '#030818' : water ? '#1a3fb8' : major ? '#4f93ff' : '#1b4fd8');
        }
        else if (l.type === 'symbol') {
          if (/poi|housenumber/.test(id)) { map.setLayoutProperty(id, 'visibility', 'none'); return; }
          map.setPaintProperty(id, 'text-color', '#cfe4ff');
          map.setPaintProperty(id, 'text-halo-color', '#030818');
          map.setPaintProperty(id, 'text-halo-width', 1.5);
        }
      } catch (e) {}
    });
  }

  map.on('style.load', function () { build(); paint(); });
</script>
</body>
</html>
