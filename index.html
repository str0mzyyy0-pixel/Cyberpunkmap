<body>

</div>
<div id="nav" class="cut" hidden><b id="navTxt"></b><div class="row"><button class="btn" id="navVoice">ГОЛОС: ВКЛ</button><button class="btn y" id="navStop">СТОП</button></div></div>
<section id="sheet" class="cut"></section>
<footer id="status"><span id="ctr"></span><span>ТАП ПО КАРТЕ: МЕТКА</span></footer>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>

function fmtD(m) { return m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(1) + ' км'; }
function fmtT(s) { var m = Math.round(s / 60); return m < 60 ? m + ' мин' : Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин'; }
var WD = ['Mo','Tu','We','Th','Fr','Sa','Su'];
function isOpen(oh, now) {
  if (!oh) return null; if (/^\s*24\/7\s*$/.test(oh)) return true;
  now = now || new Date(); var d = (now.getDay() + 6) % 7, mins = now.getHours() * 60 + now.getMinutes(), res = null, parsed = false;

    parsed = true; var spec = m[1].trim(), applies = !spec;

      if (a <= b ? (d >= a && d <= b) : (d >= a || d <= b)) applies = true; });

}
$('#sheet').addEventListener('animationend', function () { this.classList.remove('gl'); });
$('#sheet').addEventListener('submit', function (e) { e.preventDefault(); if (e.target.id === 'sf') doSearch($('#q').value); });
$('#sheet').addEventListener('click', function (e) {
  var t = e.target.closest('[data-a]'); if (!t) return; var a = t.dataset.a, i = t.dataset.i, f;
  if (a === 'res') pick(lastSearch[i]); else if (a === 'plc') pick(lastPlaces[i]);
  else if (a === 'hist') doSearch(getJ('hist', [])[i]);
  else if (a === 'home' || a === 'work') { var v = getJ(a, null); if (v) pick(v); else t.textContent = 'Откройте место и нажмите «Мой ' + (a === 'home' ? 'дом' : 'работа') + '»'; }
  else if (a === 'cat') { nameF = ($('#nf') || {}).value || ''; doCat(i); }
  else if (a === 'oo') { openOnly = !openOnly; nameF = ($('#nf') || {}).value || ''; if (lastCat) doCat(lastCat); else render(); }
  else if (a === 'mode') { mode = i; routeSteps = []; buildRoute(); }
  else if (a === 'build') buildRoute();
  else if (a === 'clr') { clearRoute(); routeA = null; stops = []; setWp(); render(); }
  else if (a === 'meA') { routeA = null; clearRoute(); setWp(); render(); }

  else if (a === 'nav') startNav();
  else if (a === 'fgo') pick(getJ('favs', [])[i]);
  else if (a === 'fdel') { f = getJ('favs', []); f.splice(i, 1); setJ('favs', f); render(); }
  else if (a === 'go') { show('route'); buildRoute(); }
  else if (a === 'setA') { routeA = { name:sel.name, lat:sel.lat, lon:sel.lon }; setWp(); t.textContent = 'А ЗАДАНА'; }
  else if (a === 'addStop') { stops.push({ name:sel.name, lat:sel.lat, lon:sel.lon }); setWp(); t.textContent = 'ДОБАВЛЕНА'; }
  else if (a === 'fav') { f = getJ('favs', []); f.push({ name:sel.name, lat:sel.lat, lon:sel.lon }); setJ('favs', f); t.textContent = 'СОХРАНЕНО'; }
  else if (a === 'setHome' || a === 'setWork') { setJ(a === 'setHome' ? 'home' : 'work', { name:(a === 'setHome' ? 'Дом: ' : 'Работа: ') + sel.name, addr:sel.addr, lat:sel.lat, lon:sel.lon }); t.textContent = 'СОХРАНЕНО'; }
  else if (a === 'copy') copy(sel.lat.toFixed(6) + ', ' + sel.lon.toFixed(6), t);
  else if (a === 'share') copy(location.origin + location.pathname + '#18/' + sel.lat.toFixed(6) + '/' + sel.lon.toFixed(6), t);
  else if (a === 'drop') { sel = null; if (marker) { marker.remove(); marker = null; } show('search'); }

function copy(txt, btn) { try { navigator.clipboard.writeText(txt); btn.textContent = 'СКОПИРОВАНО'; } catch (e) { btn.textContent = txt; } }

/* ---------- метка ---------- */
function pick(p, fly) {
  if (!p) return; sel = p;
  if (!marker) { var el = document.createElement('div'); el.className = 'pin'; marker = new maplibregl.Marker({ element:el }).setLngLat([p.lon, p.lat]).addTo(map); } else marker.setLngLat([p.lon, p.lat]);
  if (fly !== false) map.flyTo({ center:[p.lon, p.lat], zoom:Math.max(map.getZoom(), 16), duration:1500 });
  clearRoute(); show('place');
  if (!p.addr) fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ru&zoom=18&extratags=1&lat=' + p.lat + '&lon=' + p.lon).then(function (r) { return r.json(); }).then(function (d) {
    if (sel === p && d && d.display_name) { p.addr = d.display_name; if (!p.t) p.t = d.extratags; if (p.name === 'Метка' && d.name) p.name = d.name; if (cur === 'place') render(); } }).catch(function () {});

    if (sel === p && d && d.elevation) { p.elev = d.elevation[0]; if (cur === 'place') render(); } }).catch(function () {});
}
map.on('click', function (e) {
  if (ms.on) { ms.pts.push([e.lngLat.lng, e.lngLat.lat]); setMs(); render(); return; }
  var fs = map.getLayer('found-dot') ? map.queryRenderedFeatures(e.point, { layers:['found-dot'] }) : [];
  if (fs.length) { var f = fs[0], pr = f.properties; pick({ name:pr.name, addr:pr.addr, t:pr.t ? JSON.parse(pr.t) : null, lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0] }, false); return; }
  pick({ name:'Метка', lat:e.lngLat.lat, lon:e.lngLat.lng }, false);
});

/* ---------- поиск ---------- */
function doSearch(q) {
  q = (q || '').trim(); if (!q) return;
  var h = getJ('hist', []).filter(function (x) { return x !== q; }); h.unshift(q); setJ('hist', h.slice(0, 8));
  var c = parseCoords(q); if (c) { pick({ name:'Координаты', lat:c.lat, lon:c.lon }); return; }
  var b = map.getBounds();
  fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=ru&extratags=1&limit=6&q=' + encodeURIComponent(q) + '&viewbox=' + [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].join(','))
    .then(function (r) { return r.json(); }).then(function (d) {
      lastSearch = d.map(function (x) { return { name:x.name || x.display_name.split(',')[0], addr:x.display_name, t:x.extratags, lat:+x.lat, lon:+x.lon }; });
      if (!lastSearch.length) lastSearch = [{ name:'Ничего не найдено', addr:'Попробуйте уточнить адрес', lat:map.getCenter().lat, lon:map.getCenter().lng }];
      render(); $('#q').value = q;
    }).catch(function () { lastSearch = [{ name:'Нет связи с поиском', addr:'Проверьте интернет и повторите', lat:map.getCenter().lat, lon:map.getCenter().lng }]; render(); });
}

/* ---------- места рядом ---------- */
function doCat(id) {
  lastCat = id; var cat = CATS.filter(function (c) { return c[0] === id; })[0], ctr = map.getCenter();
  placesNote = 'Ищу: ' + cat[1] + '…'; lastPlaces = []; render();
  var q = '[out:json][timeout:20];(node' + cat[2] + '(around:1500,' + ctr.lat + ',' + ctr.lng + ');way' + cat[2] + '(around:1500,' + ctr.lat + ',' + ctr.lng + '););out tags center 200;', nf = nameF.trim().toLowerCase();
  fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
    lastPlaces = d.elements.map(function (x) {
      var la = x.lat || (x.center && x.center.lat), lo = x.lon || (x.center && x.center.lon), t = x.tags || {};
      return { name:t.name || t.operator || cat[1], addr:[t['addr:street'], t['addr:housenumber']].filter(Boolean).join(', '), t:t, lat:la, lon:lo, d:dist(ctr.lat, ctr.lng, la, lo) };
    }).filter(function (p) {
      if (!p.lat) return false;
      if (nf && [p.t.name, p.t.operator, p.t.brand, p.t.network].join(' ').toLowerCase().indexOf(nf) < 0) return false;
      return !openOnly || isOpen(p.t.opening_hours) === true;
    }).sort(function (a, b) { return a.d - b.d; }).slice(0, 40);
    lastPlaces.forEach(function (p) { p.dist = fmtD(p.d); });
    placesNote = lastPlaces.length ? cat[1] + ': ' + lastPlaces.length + ', от ближнего к дальнему.' + (openOnly ? ' Только с подтверждённым «открыто».' : '') : 'Ничего не найдено. Сдвиньте карту или смягчите фильтры.';
    found = { type:'FeatureCollection', features:lastPlaces.map(function (p) { return { type:'Feature', properties:{ name:p.name, addr:p.addr, t:JSON.stringify(p.t) }, geometry:{ type:'Point', coordinates:[p.lon, p.lat] } }; }) };
    setSrc('found', found); render();
  }).catch(function () { placesNote = 'Нет связи с сервисом мест. Повторите позже.'; render(); });
}

/* ---------- маршрут ---------- */
function locate(cb) {
  if (!navigator.geolocation) { cb(null); return; }
  navigator.geolocation.getCurrentPosition(function (p) { setMe(p.coords.latitude, p.coords.longitude); cb(me); }, function () { cb(null); }, { enableHighAccuracy:true, timeout:10000 });
}
function setMe(la, lo) { me = { lat:la, lon:lo }; if (!meMarker) { var el = document.createElement('div'); el.className = 'me'; meMarker = new maplibregl.Marker({ element:el }); } meMarker.setLngLat([lo, la]).addTo(map); }
function stepVerb(s) {
  var m = s.maneuver, D = { left:'налево', right:'направо', 'slight left':'левее', 'slight right':'правее', 'sharp left':'резко налево', 'sharp right':'резко направо', uturn:'развернитесь' };
  var v = m.type === 'depart' ? 'Старт' : m.type === 'arrive' ? 'Финиш' : /roundabout|rotary/.test(m.type) ? 'Круговое движение' : m.modifier === 'straight' ? 'Прямо' : 'Поверните ' + (D[m.modifier] || '');
  return v + (s.name ? ', ' + s.name : '');
}
function clearRoute() { routeGeo = EMPTY(); setSrc('route', routeGeo); routeHtml = ''; routeSteps = []; if (nav.on) stopNav(); }
function buildRoute() {
  if (!sel) return; routeHtml = '<p class="muted">Строю маршрут…</p>'; render();
  var go = function (o) {
    if (!o) { routeHtml = '<p class="muted">Не удалось узнать ваше положение. Разрешите геолокацию или задайте точку А.</p>'; render(); return; }
    var pts = [o].concat(stops, [sel]).map(function (p) { return p.lon + ',' + p.lat; }).join(';');
    fetch('https://routing.openstreetmap.de/routed-' + mode + '/route/v1/driving/' + pts + '?overview=full&geometries=geojson&steps=true').then(function (r) { return r.json(); }).then(function (d) {
      if (!d.routes || !d.routes.length) { routeHtml = '<p class="muted">Маршрут не найден.</p>'; render(); return; }
      var r = d.routes[0]; routeGeo = { type:'FeatureCollection', features:[{ type:'Feature', properties:{}, geometry:r.geometry }] }; setSrc('route', routeGeo);
      routeSteps = []; r.legs.forEach(function (l) { routeSteps = routeSteps.concat(l.steps); });
      var bb = new maplibregl.LngLatBounds(); r.geometry.coordinates.forEach(function (c) { bb.extend(c); });
      map.fitBounds(bb, { padding:{ top:90, bottom:window.innerHeight * 0.5, left:30, right:60 }, duration:1200 });
      routeHtml = '<p class="big">' + fmtT(r.duration) + ' · ' + fmtD(r.distance) + '</p>' + routeSteps.map(function (s) { return '<div class="step">' + esc(stepVerb(s)) + ' · ' + fmtD(s.distance) + '</div>'; }).join('');
      render();
    }).catch(function () { routeHtml = '<p class="muted">Сервис маршрутов недоступен. Повторите позже.</p>'; render(); });
  };
  if (routeA) go(routeA); else locate(go);
}
function setWp() {
  var fs = []; if (routeA) fs.push({ type:'Feature', properties:{ n:'А' }, geometry:{ type:'Point', coordinates:[routeA.lon, routeA.lat] } });
  stops.forEach(function (p, i) { fs.push({ type:'Feature', properties:{ n:String(i + 1) }, geometry:{ type:'Point', coordinates:[p.lon, p.lat] } }); });
  wpGeo = { type:'FeatureCollection', features:fs }; setSrc('wp', wpGeo);
}

/* ---------- ведение по маршруту ---------- */
function startNav() {
  if (!routeSteps.length) return; nav.on = true; nav.idx = 1; nav.said = -1; nav.prev = null; $('#nav').hidden = false; open = false; render();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { nav.wake = w; }); } catch (e) {}
  say('Начинаем движение');
  nav.watch = navigator.geolocation.watchPosition(onPos, function () { $('#navTxt').textContent = 'Нет сигнала GPS'; }, { enableHighAccuracy:true, maximumAge:1000 });
}
function onPos(p) {
  var la = p.coords.latitude, lo = p.coords.longitude, hd = p.coords.heading; setMe(la, lo);
  if ((hd == null || isNaN(hd)) && nav.prev && dist(nav.prev.lat, nav.prev.lon, la, lo) > 3) hd = bearing(nav.prev.lat, nav.prev.lon, la, lo);
  if (nav.prev == null || dist(nav.prev.lat, nav.prev.lon, la, lo) > 3) nav.prev = { lat:la, lon:lo };
  map.easeTo({ center:[lo, la], bearing:(hd == null || isNaN(hd)) ? map.getBearing() : hd, pitch:60, zoom:17, duration:900 });
  var s = routeSteps[nav.idx]; if (!s) { say('Вы прибыли'); stopNav(); return; }
  var d = dist(la, lo, s.maneuver.location[1], s.maneuver.location[0]), txt = stepVerb(s);
  $('#navTxt').textContent = s.maneuver.type === 'arrive' ? 'Финиш через ' + fmtD(d) : 'Через ' + fmtD(d) + ': ' + txt;
  if (d < 200 && nav.said !== nav.idx) { nav.said = nav.idx; say(s.maneuver.type === 'arrive' ? 'Через ' + Math.round(d / 10) * 10 + ' метров финиш' : 'Через ' + Math.round(d / 10) * 10 + ' метров, ' + txt); }
  if (d < 30) { if (s.maneuver.type === 'arrive') { say('Вы прибыли'); stopNav(); } else nav.idx++; }
}
function stopNav() {
  nav.on = false; $('#nav').hidden = true;
  if (nav.watch != null) navigator.geolocation.clearWatch(nav.watch); nav.watch = null;
  try { if (nav.wake) nav.wake.release(); } catch (e) {} nav.wake = null; try { speechSynthesis.cancel(); } catch (e) {}
}
$('#navStop').addEventListener('click', function () { stopNav(); });
$('#navVoice').addEventListener('click', function () { nav.voice = !nav.voice; this.textContent = 'ГОЛОС: ' + (nav.voice ? 'ВКЛ' : 'ВЫКЛ'); });

/* ---------- линейка ---------- */
function setMs() { setSrc('measure', { type:'FeatureCollection', features:[{ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates:ms.pts.length > 1 ? ms.pts : [] } }].concat(ms.pts.map(function (c) { return { type:'Feature', properties:{}, geometry:{ type:'Point', coordinates:c } }; })) }); }
function setRule(on) { ms.on = on; $('#tRule').classList.toggle('act', on); if (on) show('measure'); else { ms.pts = []; setMs(); show('search'); } }
$('#tRule').addEventListener('click', function () { setRule(!ms.on); });

/* ---------- слои карты ---------- */
function setSrc(id, data) { var s = map.getSource(id); if (s) s.setData(data); }
function firstSymbol() { var ls = map.getStyle().layers; for (var i = 0; i < ls.length; i++) if (ls[i].type === 'symbol') return ls[i].id; }
function build() {
  var b = firstSymbol(), vis = { visibility:housesOn ? 'visible' : 'none' }, rl = { 'line-cap':'round', 'line-join':'round' };
  try {
    map.addLayer({ id:'road-glow', type:'line', source:'openmaptiles', 'source-layer':'transportation', filter:['match',['get','class'],['motorway','trunk','primary','secondary','tertiary'],true,false], layout:rl,
      paint:{ 'line-color':'#1e5bff', 'line-opacity':0.6, 'line-blur':6, 'line-width':['interpolate',['exponential',1.5],['zoom'],10,2,16,12,19,32] } }, b);
    map.addLayer({ id:'house-bodies', type:'fill-extrusion', source:'openmaptiles', 'source-layer':'building', minzoom:13, layout:vis,
      paint:{ 'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],6],0,'#7a0c24',30,'#c4162f',120,'#ff3b4f'], 'fill-extrusion-height':['coalesce',['get','render_height'],6],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0], 'fill-extrusion-opacity':0.95 } }, b);
    map.addLayer({ id:'house-outline', type:'line', source:'openmaptiles', 'source-layer':'building', minzoom:14, layout:vis, paint:{ 'line-color':'#ff6a78', 'line-width':0.7, 'line-opacity':0.75 } }, b);
  } catch (e) {}
  map.addSource('route', { type:'geojson', data:routeGeo }); map.addSource('found', { type:'geojson', data:found }); map.addSource('wp', { type:'geojson', data:wpGeo }); map.addSource('measure', { type:'geojson', data:EMPTY() });
  map.addLayer({ id:'route-glow', type:'line', source:'route', layout:rl, paint:{ 'line-color':'#ffd400', 'line-width':12, 'line-blur':8, 'line-opacity':0.6 } });
  map.addLayer({ id:'route-core', type:'line', source:'route', layout:rl, paint:{ 'line-color':'#ffd400', 'line-width':4 } });
  map.addLayer({ id:'route-flow', type:'line', source:'route', layout:{ 'line-join':'round' }, paint:{ 'line-color':'#ffffff', 'line-width':3, 'line-dasharray':DASH[0] } });
  map.addLayer({ id:'measure-line', type:'line', source:'measure', filter:['==',['geometry-type'],'LineString'], paint:{ 'line-color':'#19f0ff', 'line-width':3, 'line-dasharray':[2,1] } });
  map.addLayer({ id:'measure-pt', type:'circle', source:'measure', filter:['==',['geometry-type'],'Point'], paint:{ 'circle-color':'#19f0ff', 'circle-radius':5, 'circle-stroke-width':2, 'circle-stroke-color':'#fff' } });
  map.addLayer({ id:'found-dot', type:'circle', source:'found', paint:{ 'circle-color':'#ffd400', 'circle-radius':7, 'circle-stroke-width':6, 'circle-stroke-color':'#ffd400', 'circle-stroke-opacity':0.35 } });
  map.addLayer({ id:'found-label', type:'symbol', source:'found', minzoom:15, layout:{ 'text-field':['get','name'], 'text-font':['Noto Sans Regular'], 'text-size':12, 'text-offset':[0,1.2], 'text-anchor':'top' },
    paint:{ 'text-color':'#ffd400', 'text-halo-color':'#030818', 'text-halo-width':1.5 } });
  map.addLayer({ id:'wp-dot', type:'circle', source:'wp', paint:{ 'circle-color':'#19f0ff', 'circle-radius':11, 'circle-stroke-width':2, 'circle-stroke-color':'#fff' } });
  map.addLayer({ id:'wp-label', type:'symbol', source:'wp', layout:{ 'text-field':['get','n'], 'text-font':['Noto Sans Regular'], 'text-size':13, 'text-allow-overlap':true }, paint:{ 'text-color':'#030818' } });
}
function paint() {
  map.getStyle().layers.forEach(function (l) {
    var id = l.id; if (/^(road-glow|house-|found-|route-|wp-|measure-)/.test(id)) return;
    try {
      if (l.type === 'background') map.setPaintProperty(id, 'background-color', '#030818');
      else if (l.type === 'fill') {

        try { map.setPaintProperty(id, 'fill-pattern', undefined); } catch (e) {}
        map.setPaintProperty(id, 'fill-color', c); map.setPaintProperty(id, 'fill-opacity', 1);
      } else if (l.type === 'fill-extrusion' || l.type === 'raster' || l.type === 'hillshade') map.setLayoutProperty(id, 'visibility', 'none');
      else if (l.type === 'line') {
        var casing = /casing|outline|case/.test(id), major = /motorway|trunk|primary|secondary|major/.test(id), water = /water|river|stream/.test(id);
        map.setPaintProperty(id, 'line-color', casing ? '#030818' : water ? '#1a3fb8' : major ? '#4f93ff' : '#1b4fd8');
      } else if (l.type === 'symbol') {
        if (/poi|housenumber/.test(id)) { map.setLayoutProperty(id, 'visibility', 'none'); return; }
        map.setPaintProperty(id, 'text-color', '#cfe4ff'); map.setPaintProperty(id, 'text-halo-color', '#030818'); map.setPaintProperty(id, 'text-halo-width', 1.5);
      }
    } catch (e) {}
  });
}
map.on('style.load', function () { build(); paint(); });
function status() { var c = map.getCenter(); $('#ctr').textContent = c.lat.toFixed(5) + '  ' + c.lng.toFixed(5) + '  ·  ЗУМ ' + map.getZoom().toFixed(1); }
map.on('move', status); status();

var di = 0, lastT = 0;
(function anim(ts) { if (!RM && routeGeo.features.length && map.getLayer('route-flow') && ts - lastT > 90) { di = (di + 1) % DASH.length; try { map.setPaintProperty('route-flow', 'line-dasharray', DASH[di]); } catch (e) {} lastT = ts; } requestAnimationFrame(anim); })(0);

$('#tLoc').addEventListener('click', function () { locate(function (o) { if (o) map.flyTo({ center:[o.lon, o.lat], zoom:16, duration:1500 }); }); });
$('#tTilt').addEventListener('click', function () { flat = !flat; map.easeTo({ pitch:flat ? 0 : 45, bearing:flat ? 0 : -15, duration:800 }); this.textContent = flat ? '2D' : '3D'; });
$('#tNorth').addEventListener('click', function () { map.easeTo({ bearing:0, duration:600 }); });
$('#tSnd').addEventListener('click', function () { soundOn = !soundOn; this.classList.toggle('off', !soundOn); });
$('#tHouse').addEventListener('click', function () { housesOn = !housesOn; this.classList.toggle('off', !housesOn);
  ['house-bodies', 'house-outline'].forEach(function (id) { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', housesOn ? 'visible' : 'none'); }); });
render();
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}
</script>
